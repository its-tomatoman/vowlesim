<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>성도 모음 시뮬레이터</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <h1>성도 모음 시뮬레이터</h1>
    <p class="sub">
      성문에서 입술까지의 관 모양을 직접 그려 1.3초 길이의 모음을 합성합니다.
      관의 위·아래 선을 클릭해 점을 만들고 끌어서 단면적을 바꾸세요.
    </p>

    <!-- 1. 성도 단면 & 키프레임 타임라인 -->
    <section class="card">
      <h2>단면 설계</h2>
      <canvas id="ed" aria-label="성도 단면 편집기"></canvas>

      <div class="row">
        <span class="hint">프리셋:</span>
        <button type="button" data-p="ah">아</button>
        <button type="button" data-p="eh">에</button>
        <button type="button" data-p="ee">이</button>
        <button type="button" data-p="oh">오</button>
        <button type="button" data-p="oo">우</button>
        <span class="hint">· 점 더블클릭: 삭제</span>
      </div>

      <canvas id="tl" aria-label="키프레임 타임라인"></canvas>

      <div class="row">
        <button type="button" id="del">선택한 키프레임 삭제</button>
        <button type="button" id="psave">프로젝트 저장 (.json)</button>
        <button type="button" id="pload">프로젝트 불러오기</button>
        <input type="file" id="pfile" accept=".json,application/json" hidden>
        <span class="hint" id="kfinfo"></span>
      </div>
    </section>

    <!-- 2. 음원 입력 및 ADSR 엔벨로프 -->
    <section class="card">
      <h2>입력과 필터</h2>

      <div class="row row-top">
        <label class="r">
          <input type="radio" name="m" value="saw" checked>
          톱니파
        </label>
        <label class="r">
          <input type="radio" name="m" value="file">
          파일 입력
        </label>
        <input type="file" id="file" accept="audio/*">
        <span class="hint" id="st"></span>
      </div>

      <div class="grid" id="sl"></div>
      <canvas id="env" aria-label="엔벨로프 형태"></canvas>
    </section>

    <!-- 3. 파형 / 스펙트로그램 출력 및 오디오 내보내기 -->
    <section class="card">
      <h2>결과</h2>

      <div class="row row-top">
        <button type="button" class="pri" id="play">재생 (1.3초)</button>
        <button type="button" id="xwav">WAV 내보내기</button>
        <button type="button" id="xmp3">MP3 내보내기</button>
        <span class="hint">슬라이더나 모양을 바꾸면 자동으로 다시 계산됩니다.</span>
      </div>

      <div id="ow">
        <canvas id="wf" aria-label="파형"></canvas>
        <canvas id="sp" aria-label="스펙트로그램 0~8kHz"></canvas>
        <div class="ax">
          <span>0 s</span>
          <span>스펙트로그램 0–8 kHz</span>
          <span>1.3 s</span>
        </div>
        <div class="ph" id="ph"></div>
      </div>
    </section>
  </main>

  <div id="xs" role="status" class="toast"></div>
</body>
</html>
